name: Waka Readme

on:
  schedule:
    # Runs at 12am IST
    - cron: '30 18 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: "waka-top"
          SHOW_TOTAL_CODE_TIME: True
          SHOW_AI_CODE_TIME: False
          SHOW_AI_CODING: False
          SHOW_SHORT_INFO: False
          SHOW_UPDATED_DATE: False
          SHOW_OS: False
          SHOW_PROJECTS: False
          SHOW_EDITORS: False
          SHOW_TIMEZONE: False
          SHOW_COMMIT: False
          SHOW_LANGUAGE: False
          SHOW_LINES_OF_CODE: False
          SHOW_LANGUAGE_PER_REPO: False
          SHOW_LOC_CHART: False
          SHOW_DAYS_OF_WEEK: False
          SHOW_PROFILE_VIEWS: False
          SYMBOL_VERSION: 1
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TOTAL_CODE_TIME: False
          SHOW_AI_CODING: False
          SHOW_LINES_OF_CODE: False
          SYMBOL_VERSION: 1
          SHOW_LOC_CHART: False
          SHOW_LANGUAGE_PER_REPO: False
          SHOW_EDITORS: False
          SHOW_TIMEZONE: False
          SHOW_PROJECTS: False
          SHOW_OS: False
          SHOW_LANGUAGE: False
          UPDATED_DATE_FORMAT: "%Y/%m/%d %H:%M:%S"
          SHOW_PROFILE_VIEWS: False
          SHOW_SHORT_INFO: False
          SHOW_UPDATED_DATE: False

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Update stats last-updated badge
        run: python3 .github/scripts/stats_timestamp.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update stats last-updated badge"
          git push || (git pull --rebase && git push)
